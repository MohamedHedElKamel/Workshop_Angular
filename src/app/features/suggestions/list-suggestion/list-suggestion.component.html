<div class="container">
  <h2>Liste des suggestions</h2>
  <button [routerLink]="['/suggestions/add']">Ajouter suggestion</button>

  <input 
    type="text" 
    placeholder="Rechercher par titre ou catégorie..." 
    [(ngModel)]="searchText"
    class="search-bar"
  />

 <div *ngFor="let s of filteredSuggestions" class="card">

  <h3>{{ s.title }}</h3>
  <p class="description">{{ s.description }}</p>

  <div class="info">
    <span><strong>Catégorie:</strong> {{ s.category }}</span>
    <span><strong>Date:</strong> {{ s.date | date:'dd/MM/yyyy' }}</span>
    <span class="status" [ngClass]="s.status">{{ s.status }}</span>
  </div>

  <div class="actions">
    <button (click)="likeSuggestion(s)">👍 Like ({{ s.likes }})</button>
    <button (click)="addToFavorites(s)">⭐ Ajouter aux favoris</button>
    <button [routerLink]="['/suggestions', s.id]">🔍 Détails</button>
    <button (click)="deleteSuggestion(s)">🗑️ Supprimer</button>
  </div>

</div>

  <h2>Suggestions favorites</h2>

  <ul>
    <li *ngFor="let f of favorites">
      {{ f.title }} ({{ f.category }})
    </li>
  </ul>

</div>
